name: SeatLock checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: seatlock
          POSTGRES_USER: seatlock
          POSTGRES_PASSWORD: local-development-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U seatlock"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
    env:
      POSTGRES_HOST: 127.0.0.1
      DEBUG: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.lock
      - name: Allow 100 simultaneous test connections
        run: |
          PGPASSWORD=local-development-only psql -h 127.0.0.1 -U seatlock -d seatlock -c "ALTER SYSTEM SET max_connections = '160';"
          docker restart ${{ job.services.postgres.id }}
          for i in {1..20}; do pg_isready -h 127.0.0.1 -U seatlock && break; sleep 1; done
      - run: ruff check .
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py migrate --noinput
      - run: pytest -q --junitxml=artifacts/tests.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: artifacts/tests.xml

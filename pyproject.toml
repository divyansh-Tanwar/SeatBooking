[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py"]
testpaths = ["tests"]
[tool.ruff]
line-length = 110
extend-exclude = [".venv", "artifacts", "*/migrations/*"]
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
"config/asgi.py" = ["E402"]
